name: Core smoke test

on:
  pull_request:
  push:
    branches:
      - bootstrap-lfly
      - main

jobs:
  core-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run ATC core smoke tests
        run: dotnet run --project tests/OhControl.CoreSmoke/OhControl.CoreSmoke.csproj --configuration Release

  ui-compile:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile WinForms UI with isolated runtime stubs
        run: dotnet build tests/OhControl.UiSmoke/OhControl.UiSmoke.csproj --configuration Release
