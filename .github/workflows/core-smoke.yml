name: Core smoke test

on:
  pull_request:
  push:
    branches:
      - bootstrap-lfly
      - main

jobs:
  core-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run ATC core smoke tests
        run: dotnet run --project tests/OhControl.CoreSmoke/OhControl.CoreSmoke.csproj --configuration Release
